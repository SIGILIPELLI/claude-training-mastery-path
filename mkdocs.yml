      - "06 · Using Claude for Code-Adjacent Tasks": level-1/06-code-adjacent-tasks.md
      - "07 · Giving Claude Documents & Context": level-1/07-documents-and-context.md
      - "08 · Iterating & Refining Outputs": level-1/08-iterating-and-refining-outputs.md
